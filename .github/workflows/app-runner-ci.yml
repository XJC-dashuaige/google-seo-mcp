name: App Runner MCP build check

on:
  pull_request:
    paths:
      - "apprunner.yaml"
      - "src/**"
      - "test/app-runner-readonly-expansion.mjs"
      - "test/oauth-dynamo-unit.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app-runner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Compile TypeScript
        run: npm run build
      - name: Verify compiled MCP entrypoint
        run: test -f dist/index.js
      - name: Verify expanded read-only toolset (offline)
        run: node test/app-runner-readonly-expansion.mjs
      - name: Verify DynamoDB OAuth durable store (mocked AWS)
        run: node test/oauth-dynamo-unit.mjs
