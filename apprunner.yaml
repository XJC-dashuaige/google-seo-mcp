version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci --ignore-scripts
      - npm run build
run:
  command: node dist/index.js --http
  network:
    port: 8080
    env: MCP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: MCP_TRANSPORT
      value: http
    - name: MCP_HOST
      value: 0.0.0.0
    - name: MCP_PORT
      value: "8080"
    - name: SEO_MCP_READ_ONLY
      value: "1"
    - name: SEO_MCP_TOOLSETS
      value: gsc
    - name: SEO_MCP_OAUTH
      value: "1"
# Required secrets: MCP_AUTH_TOKEN and GOOGLE_CREDENTIALS_JSON.
# Set these in App Runner's environment variable/secret controls, NEVER in Git.
# WARNING: OAuth grants are stored in local SQLite by this upstream project.
# App Runner's filesystem is ephemeral: don't connect ChatGPT until OAuth
# persistence has been addressed and tested.
